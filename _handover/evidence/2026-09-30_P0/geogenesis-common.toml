	["GeoGenesis Terrain Generation"."Relief Amplitudes"]
		#Craton local relief amplitude (e units). Plains/low hills. Kept moderate so HILLS class still forms; denseness is fixed via LandShape frequency, not by killing amplitude.
		#Range: 0.0 ~ 0.6
		cratonReliefAmp = 0.1
		#Orogenic belt relief amplitude (e units). Rugged mountains. Moderate value preserves MOUNTAINS class; fingerprint look fixed by larger detail frequency in LandShape.
		#Range: 0.0 ~ 0.6
		beltReliefAmp = 0.35
		#Plateau relief amplitude (e units). Flat-topped, low relief.
		#Range: 0.0 ~ 0.6
		plateauReliefAmp = 0.03
		#Basin relief amplitude (e units).
		#Range: 0.0 ~ 0.6
		basinReliefAmp = 0.05

	["GeoGenesis Terrain Generation"."Terrain Shape"]
		#Belt (orogenic) peak sharpness: pow(n, sharpness). >1 = pointed peaks, =1 = round, <1 = broad. Default 1.5.
		#Range: 0.5 ~ 5.0
		beltSharpness = 1.5
		#Belt domain warp displacement amplitude (world-space blocks). Warp elongates massifs into natural ranges; 0 = disable warp. Default 120.
		#Range: 0.0 ~ 500.0
		beltWarpAmp = 120.0
		#Province mix sharpening exponent (softmax weight power). >1 lets dominant province own its region and express full |r|=1 peak / r=0 valley; boundaries stay smooth. Default 2.5.
		#Range: 1.0 ~ 5.0
		provMixSharpness = 2.5
		#Mountain mask noise scale (world-space blocks). Low-frequency blobs limit mountains to belts/clusters (realism key, ref TerraForged). Default 2200.
		#Range: 400.0 ~ 8000.0
		mountainMaskScale = 2200.0
		#Surface micro-detail noise scale (blocks). Large period, tiny amplitude (<0.03 e) for texture only, not terrain. Default 450.
		#Range: 200.0 ~ 2000.0
		microDetailScale = 450.0
		#Surface micro-detail amplitude (e units). Must stay tiny (<0.03) to avoid competing with relief. Default 0.025.
		#Range: 0.0 ~ 0.08
		microDetailAmp = 0.025

