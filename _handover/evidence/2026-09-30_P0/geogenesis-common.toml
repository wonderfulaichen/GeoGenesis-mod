	["GeoGenesis Terrain Generation".Erosion]
		#Extra-fine (XS, r1wu cross-brush) micro-erosion detail layer. Adds 1-2 block textures on slopes, but amplifies cross-chunk birth-set discreteness into visible ridges near chunk borders (measured +1.6 blocks at tile borders). Default false (conservative).
		erosionXSEnabled = true
		#Enable local particle erosion (seamless, margin-filled with true neighbour heights). Default true.
		erosionEnabled = true
		#Erosion strength multiplier. Default 1.0, range [0, 4].
		#Range: 0.0 ~ 4.0
		erosionStrength = 1.0
		#Erosion droplet count multiplier. Lower = faster (preview). Default 1.0, range [0.1, 4].
		#Range: 0.1 ~ 4.0
		erosionDropsMul = 1.0
		#Erosion erode-rate multiplier. Default 1.0, range [0.1, 4].
		#Range: 0.1 ~ 4.0
		erosionErodeMul = 1.0
		#localCharge positive feedback weight α. Each droplet's cumulative desc ent amplifies capacity: 0=off, higher=main valleys cut deeper vs tributaries. Default 1.0, range [0, 5].
		#Range: 0.0 ~ 5.0
		erosionLocalChargeWeight = 1.0
		#Local cascade settling strength. After erosion, transfer material from higher cells toward lowest 8-neighbor, smoothing riverbeds. 0=off. Default 0.5 (2026-08-10: 0.3->0.5, sharper gully edges), range [0, 1].
		#Range: 0.0 ~ 1.0
		erosionCascadeStrength = 0.5
		#SH momentum-field positive feedback: droplets self-accelerate along downstream momentum field (rivers self-reinforce). 1.0 = SH original, 0 = off. Default 1.0, range [0, 2].
		#Range: 0.0 ~ 2.0
		erosionMomentumTransfer = 1.0
		#SH multi-pass iteration count: each pass respawns all droplets + lrate field smoothing; channels deepen progressively. Default 2 (2026-08-11: 5->2, deep-gully fix; SH Erosion.cs numIterations=1, 2 keeps momentum field accumulation), range [1, 16].
		#Range: 1 ~ 16
		erosionIterations = 2
		#SH field smoothing rate lrate: proportion of each pass's track blended into the steady-state field (0.1 = SH original). Default 0.1, range [0.01, 0.5].
		#Range: 0.01 ~ 0.5
		erosionLrate = 0.1
		#Coarse ridge-valley skeleton layer (gradient-aligned stripe filter). Builds mountain-ridge basic form before particle detail erosion. Default true.
		erosionRidgeEnabled = true
		#Coarse skeleton erosion strength. Default 2.0 (2026-08-12: 3.0 用户实测过头，回调 2.0 约 ±2.5 块), range [0, 5.0].
		#Range: 0.0 ~ 5.0
		erosionRidgeStrength = 2.0
		#Coarse skeleton feature size (world blocks) = stripe cell world size; larger = wider ridges. Default 100, range [50, 800].
		#Range: 50.0 ~ 800.0
		erosionRidgeScale = 100.0
		#Coarse skeleton in-cell stripe frequency (ridge-valley density). Default 1.2, range [0.2, 2.0].
		#Range: 0.2 ~ 2.0
		erosionRidgeCellScale = 1.2
		#Coarse skeleton octaves (main + secondary + fine gullies; 4 at spacing=2 no aliasing). Default 4, range [1, 5].
		#Range: 1 ~ 5
		erosionRidgeOctaves = 4
		#Coarse skeleton slope-accumulation weight (ridge-valley sharpness). Default 0.65 (2026-08-06: 0.5→0.65 加强条纹), range [0, 1].
		#Range: 0.0 ~ 1.0
		erosionRidgeGullyWeight = 0.65
		#Ridge profile rounding (0=sharp V-cut, 0.5=default balanced, 1=max rounded U-shape). Default 0.5, range [0, 1].
		#Range: 0.0 ~ 1.0
		erosionRidgeRounding = 0.5
		#Coarse skeleton fadeTarget reference (land median, e units). Default 0.15 matches land median; old fixed 0.25 caused uniform 4~11-block downcutting on low-elevation worlds. Range [0.02, 0.5].
		#Range: 0.02 ~ 0.5
		erosionRidgeLandRef = 0.15
		#Gully detail density (PowInv exponent; lower=finer gullies everywhere, higher=cleaner main ridges). Default 1.0, range [0.7, 3.0].
		#Range: 0.7 ~ 3.0
		erosionRidgeDetail = 1.0
		#Adaptive river routing: blend erosion delta into the D8 routing field so river lines follow eroded gullies. WARNING (measured 2026-09-08): network build covers the whole region grid, so enabling this triggers synchronous cold generation of ALL erosion tiles in the area (~200ms each, hundreds of tiles) -> world load stalls for minutes. Default false; enable only for offline experiments.
		erosionRoutingAdaptive = false
		#Erosion yields to river channel (FreeTerraForged-style erosionMask): attenuate the erosion delta applied to the riverbed by distance to channel center (0 at center, 1 outside valley) so the bed stays coherent with the planned monotonic water surface. Fixes erosion-induced non-monotonic terraced waterfalls and dry sand bars poking through the water. Default true; set false to restore old full-follow behavior.
		erosionYieldToRiver = true

	["GeoGenesis Terrain Generation"."Coastline Transition"]
		#Ocean fade start (cBiased space). Ocean depth begins fading to 0 at this continentality. More negative = wider coastal transition (eLand joins coastline positioning). Default -0.13 (2026-08-06), range [-0.5, 0.0].
		#Range: -0.5 ~ 0.0
		oceanFadeStart = -0.13
		#Land ramp end (cBiased space). Full land height is reached at this continentality. Higher = wider beach zone before full terrain appears. Default 0.05 (2026-08-06), range [0.0, 0.5].
		#Range: 0.0 ~ 0.5
		landRampEnd = 0.05

