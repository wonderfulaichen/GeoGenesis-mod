	["GeoGenesis Terrain Generation"."Coastline Diversification"]
		#海岸线 warp 振幅（c 空间单位）。注意：大陆性 c 场现已是 FBM（多尺度细节直接刻进海岸线），此 warp 是在 c 上的额外位移补丁。默认 0.15（2026-08-06 破圆弧：0.05 位移仅 ~57 块不可见），范围 [0, 0.3]。
		#Range: 0.0 ~ 0.3
		coastlineWarpAmp = 0.15
		#海岸线 warp 基频世界坐标尺度（块）。越大变化越平缓。默认 1200（2026-08-06：300 波长在大俯视图不可见，1200 产生半岛/海湾级弯曲），范围 [50, 2000]。
		#Range: 50.0 ~ 2000.0
		coastlineWarpScale = 1200.0
		#海岸线 warp 倍频数（octaves）：控制分形细节尺度层级数。越大海岸线越多尺度（自相似犬牙交错），越小越平滑。默认 6，范围 [1, 8]。
		#Range: 1 ~ 8
		coastlineWarpOctaves = 6
		#FBM 频率倍增系数（lacunarity）：每倍频频率×该值。默认 2.0，范围 [1.5, 3.0]。
		#Range: 1.5 ~ 3.0
		coastlineWarpLacunarity = 2.0
		#FBM 振幅衰减系数（persistence）：每倍频振幅×该值。默认 0.6（2026-08-06 0.5→0.6 增强高频细齿），范围 [0.25, 0.8]。
		#Range: 0.25 ~ 0.8
		coastlineWarpPersistence = 0.6
		#地形类型调制强度（c 空间单位）。山地权重高→推岸出海成岬角/悬崖，平原→拉岸内凹成海湾。默认 0.08，范围 [0, 0.3]。
		#Range: 0.0 ~ 0.3
		coastTerrainInfluence = 0.08
		#离岸群岛带宽度（c 空间单位，从 coastLoc 向海侧延伸）。越大群岛可出现的海域范围越宽。默认 0.10，范围 [0, 0.3]。
		#Range: 0.0 ~ 0.3
		archipelagoBand = 0.1
		#离岸群岛密度阈值（噪声 0-1）。超过此阈值才生成岛屿。越低→岛屿越多越密集。默认 0.30，范围 [0, 1]。
		#Range: 0.0 ~ 1.0
		archipelagoDensity = 0.3
		#离岸群岛噪声尺度（块）。越大→岛屿团块越大越稀疏。默认 120，范围 [30, 500]。
		#Range: 30.0 ~ 500.0
		archipelagoScale = 120.0
		#离岸群岛最大高度（e 单位）。岛屿在地形 e 上的高度上限。默认 0.035，范围 [0, 0.15]。
		#Range: 0.0 ~ 0.15
		archipelagoHeight = 0.035

