
["GeoGenesis Terrain Generation"]

	["GeoGenesis Terrain Generation".Scale]
		#Horizontal scale (0.5-8.0). Block->wu mapping (DEM resample concept): MC blocks divided by this = engine world-units. All terrain features (macro noise + erosion brushes + river carving + source grid) scale uniformly. Default 2.0 (2026-08-02: terrain was too steep H/W, overall frequency widening x2 restores normal slopes; 2026-08-10: wu-ized - engine never knows blocks, mapping happens at GeoGenesisTerrain facade only).
		#Range: 0.5 ~ 8.0
		horizontalScale = 2.0
		#Vertical scale multiplier (1-8). Applied to e->Y height mapping. 1=default, 2=twice as tall.
		#Range: 1.0 ~ 8.0
		verticalScale = 1.0

	["GeoGenesis Terrain Generation"."Continent Field"]
		#Continent noise scale (blocks). Frequency = 1/scale. HS parameter: HS = continentScale/1000. Range: 1-8 (HS) = 1000-8000.
		#Range: 1000.0 ~ 8000.0
		continentScale = 4000.0
		#Domain warp intensity as fraction of continentScale (applied to the FBM continent field). 0=disabled (pure FBM, recommended — FBM octaves already provide natural continent shape; warping fine FBM detail creates parallel banding). Raise only if you want extra large-scale continent bending. Default 0.0, range [0,1].
		#Range: 0.0 ~ 1.0
		continentWarp = 0.0
		#Continent FBM octaves: continentality c field is a multi-octave FBM value stack (each octave freq×lacunarity, amp×persistence). Coastline = c=0 iso-line, so FBM multi-scale detail carves the coast directly → natural fractal shoreline (ref procedural-island-generator). Default 6, range [1,10].
		#Range: 1 ~ 10
		continentFbmOctaves = 6
		#Continent FBM frequency multiplier (lacunarity): each octave freq×this. Default 2.0, range [1.5,3.0].
		#Range: 1.5 ~ 3.0
		continentFbmLacunarity = 2.0
		#Continent FBM amplitude decay (persistence): each octave amp×this; higher = stronger high-freq detail = more jagged coast. Default 0.6, range [0.3,0.85].
		#Range: 0.3 ~ 0.85
		continentFbmPersistence = 0.6
		#Reference continentality c value ∈ [-1,1]. NOT the coastline; coastline = e=0 natural crossing (see terrain-rebuild §1.4). 0=coast anchor, negative=ocean, positive=land — aligned with vanilla Continentalness.
		#Range: -1.0 ~ 1.0
		continentThreshold = 0.0
		#Land/ocean ratio bias (FBM continent field). Positive = more ocean, negative = more land. RMS-normalized FBM concentrates c near 0, so the bias is much lower than the old single-simplex 0.82. Default 0.31 yields ~35% land / 65% ocean (calibrated against the REAL CellGenerator.sample() pipeline via TerrainAreaProbe: the prior simplified c+eFromC formula was wrong).
		#Range: -0.6 ~ 1.5
		continentBias = 0.31
		#Continent field warp amplitude for province sampling (blocks). EXPERIMENTAL: warping by c biases mountain ridge direction toward the c gradient (see GeoGenesisMod discussion). Safe default 0 = disable. Enable only if you understand the directional bias.
		#Range: 0.0 ~ 8000.0
		continentProvinceWarp = 0.0

