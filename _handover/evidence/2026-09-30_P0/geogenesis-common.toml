	["GeoGenesis Terrain Generation"."River Network"]
		#Master switch for river generation (hydrology model: flow-accumulation derived network + distance-field carving).
		riverEnabled = true

	["GeoGenesis Terrain Generation".Caves]
		#Cave preset (gameplay-first, one-click): REALISTIC = current default, geological (limestone karst caves are big, granite almost none, horizontal stratified caves); VANILLA_LIKE = closer to vanilla feel (bigger rounder chambers, no layering, rock type ignored); MINIMAL = sparse thin tunnels only; OFF = NO caves at all (vanilla carvers are UNAVAILABLE in this custom ChunkGenerator, so 'off' means an empty underground, same as RTG's useCaves=false); CUSTOM = use the individual knobs below as-is.
		#Allowed Values: OFF, VANILLA_LIKE, MINIMAL, REALISTIC, CUSTOM
		cavePreset = "REALISTIC"
		#Master switch for cave carving. false = no caves at all (independent of cavePreset).
		caveEnabled = true
		#Enable TUNNEL component (winding 1D tubes formed by two noise isosurface intersections; provides 'connectivity').
		caveTunnelEnabled = true
		#Enable CHAMBER component (walkable hall-like voids; provides 'room to walk'). Disabling leaves only thin tunnels -> players cannot stand up (a failure mode measured before).
		caveChamberEnabled = true
		#Enable LAYER modulation (squashes tall chambers into horizontal strata). Prevents vertically-through-going shafts. Disable for vanilla-cheese-like blob caves (accepts the risk of vertical shafts).
		caveLayerEnabled = true
		#Cave density multiplier applied to component thresholds (bigger = thicker & more caves). Default 1.0, range [0.2, 3.0].
		#Range: 0.2 ~ 3.0
		caveDensityMul = 1.0
		#Roof protection thickness in blocks: cave ceilings stay at least this far below the surface. 0 = caves MAY breach the surface (creates cave entrances, good for exploration). Default 6, range [0, 40].
		#Range: 0 ~ 40
		caveSurfaceLid = 6
		#Shallowest cave depth below surface (blocks). Default 8, range [0, 80].
		#Range: 0 ~ 80
		caveDepthMin = 8
		#Deepest cave depth below surface (blocks). Default 120, range [40, 320].
		#Range: 40 ~ 320
		caveDepthMax = 120
		#Rock-type gating (PROJECT-UNIQUE, absent in all 3 reference projects): limestone karst caves are 1.7x bigger, granite/gneiss almost none (0.55x). Disable for vanilla-like uniform caves.
		caveLithoGating = true
		#Underground cave biomes: DRIPSTONE_CAVES everywhere, LUSH_CAVES in forest climates. Decoration (stalactites/moss/vines) is placed by vanilla automatically. Disable to keep the surface biome underground.
		caveBiomesEnabled = true

	["GeoGenesis Terrain Generation".Ores]
		#Self-developed geological ore veins (PROJECT-UNIQUE: ore is placed by HOST ROCK + depth band -- e.g. coal only in sandstone/shale, lapis only in limestone, diamond only in gneiss/schist). true (default) = ON: these veins are placed ON TOP of the vanilla ore. false = OFF: keep ONLY vanilla ore (pure-vanilla ore experience). NOTE: vanilla ore (ore_coal/ore_iron/... , placed from biome features) is ALWAYS generated and is NOT controlled by this switch; it intentionally DOES pollute the geological strata (that is vanilla behaviour and is left alone here). Takes effect on world (re)load; already-generated chunks are unchanged.
		oreVeinsEnabled = true
		#★ Ore system takeover (see docs/plans/矿物系统-预研-2026-09-18.md, 'path D'). false (default) = VANILLA: do NOT touch vanilla ore at all (zero behaviour change). true = OVERRIDE: REMOVE minecraft metal ore features (19 placed_feature ids: coal/iron/ gold/redstone/diamond/lapis/copper/emerald/infested variants) from the biome decoration pipeline, so the underground ore is placed ONLY by the self-developed OreVeins (host-rock + depth-band geology). Vanilla water details (disk_*/underwater_magma) and the strata-protection filter are unaffected. MOD COMPATIBILITY: only the 'minecraft' namespace is removed, so ore from ANY other mod is always left untouched. NOTE: enabling this REDUCES total ore (vanilla ore is currently already gated by our rock layers via the stone_ore_replaceables tag) -- use it to A/B compare ore volume. Takes effect on world (re)load; already-generated chunks are unchanged.
		oreOverrideVanilla = false

	["GeoGenesis Terrain Generation".Hydrology]
		#Water balance: downstream decay (evaporation / infiltration) along flow paths. false (default) = OFF: pure accumulation, zero behaviour change (bit-identical). true = CLIMATE: decay is driven by precipitation (the most direct proxy for aridity) -- arid regions evaporate strongly, so rivers fade out (endorheic / ephemeral rivers), while humid regions get decay = 0 and rivers run through to the sea. SCOPE: affects river network size only (hence river width / lake extent), NOT terrain height. Takes effect on world (re)load; already-generated chunks are unchanged.
		hydrologyDecayEnabled = false
		#Maximum downstream decay coefficient (1/wu) in the driest regions. Higher = more endorheic rivers. Default 2e-3. Measured (runWaterBalanceProbe, grid 64): 1e-3 => mean river width x0.97; 2e-3 => x0.95, total water x0.87. Range [0, 2e-2]
		#Range: 0.0 ~ 0.02
		hydrologyDecayMax = 0.002
		#Reference precipitation: at or above this value the climate is considered humid and decay becomes exactly 0 (zero disturbance). Default 0.7647 (near the measured global precipitation mean). Range [0.05, 2.0]
		#Range: 0.05 ~ 2.0
		hydrologyDecayRef = 0.7647
		#Softening exponent for the decay ramp: decay = maxDecay * max(0, 1 - precip/ref)^exponent. Values below 1 give semi-arid regions noticeable decay too. Default 0.5. Range [0.1, 3.0]
		#Range: 0.1 ~ 3.0
		hydrologyDecayExponent = 0.5
		#LEGACY COMPATIBILITY KEY. Production always uses the single flow-physics pipeline: source -> accumulation -> depression storage -> lowest spillway -> downstream -> sea. This value is read only for migration diagnostics and is ignored for routing. The old 48-block tracing / legacy lake pipeline is no longer a production fallback. Takes effect on world (re)load; already-generated chunks are unchanged.
		hydrologySkeletonRouting = true

	["GeoGenesis Terrain Generation".Diagnostics]
		#World-generation full-pipeline profiler. Logs per-stage timing to latest.log (prefix [WGP]). WHY: the pre-existing [PERF-TERRAIN] / [PERF] fillFromNoise logs only fire ABOVE a threshold (50ms / 100ms), so fast chunks are never recorded and no distribution can be computed; and applyBiomeDecoration (trees/grass/ore) plus applyCarvers (caves) had NO instrumentation at all -- yet they are the heaviest stages in a real game. When on, a rolling summary is printed every worldgenProfilerEveryChunks chunks (count / total / mean / P50 / P95 / max / share, plus the 8 slowest chunks), and a grand total on world unload. Output is also written to geogenesis-wgp.txt (UTF-8) in the game directory. false (default) = OFF, zero overhead, bit-identical output (the profiler consumes no random numbers).
		worldgenProfilerEnabled = true
		#Profiler rolling-summary interval, in chunks. 0 = only print the grand total on world unload. Default 200. Range [0, 100000]
		#Range: 0 ~ 100000
		worldgenProfilerEveryChunks = 200

