// Diagnostic-only task; no production switch, cache identity or world generation changes.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.tasks.register('runMultiphysicsContractProbe', JavaExec) {
        dependsOn project.tasks.named('compileDiagnosticsJava')
        classpath = project.sourceSets.diagnostics.runtimeClasspath
        mainClass = 'com.geogenesis.worldgen.hydrology.model.MultiphysicsContractProbe'
        jvmArgs '-Dfile.encoding=UTF-8'
    }
    project.tasks.register('runTraceProductionContractProbe', JavaExec) {
        dependsOn project.tasks.named('compileDiagnosticsJava')
        classpath = project.sourceSets.diagnostics.runtimeClasspath
        mainClass = 'com.geogenesis.worldgen.hydrology.model.TraceProductionContractProbe'
        maxHeapSize = '10g'
        jvmArgs '-Dfile.encoding=UTF-8'
        if (project.hasProperty('probeArgs')) args project.property('probeArgs').toString().split(' ')
    }
    ['OutsidePathOrderProbe', 'ProductionCoverageProbe', 'ProductionLifecycleProbe',
     'ProductionOwnershipProbe', 'SeamBandBoundaryProbe', 'JoinOwnershipProbe',
     'JoinCellContainmentProbe', 'HandoffStartProbe', 'DeadEndCauseProbe',
     'SelfJoinFixProbe', 'FrameEscapeProbe', 'SpillRiseAuditProbe',
     'SpillSeenConflictProbe', 'DeadEndPathProbe'].each { probe ->
        project.tasks.register('run' + probe, JavaExec) {
            dependsOn project.tasks.named('compileDiagnosticsJava')
            classpath = project.sourceSets.diagnostics.runtimeClasspath
            mainClass = 'com.geogenesis.worldgen.hydrology.model.' + probe
            maxHeapSize = '10g'
            jvmArgs '-Dfile.encoding=UTF-8'
            if (project.hasProperty('probeArgs')) args project.property('probeArgs').toString().split(' ')
        }
    }
}
